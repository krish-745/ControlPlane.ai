[tool.poetry]
name = "controlplane-ai"
version = "0.1.0"
description = "Real-time AI runtime policy engine"
authors = ["ControlPlane Team"]

[tool.poetry.dependencies]
python = "^3.11"

# Core proxy
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-dotenv = "^1.0.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# LLM routing
litellm = "^1.40.0"

# Database
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"

# Cache
redis = {extras = ["hiredis"], version = "^5.0.0"}

# Embeddings (Stage 2 grounding)
sentence-transformers = "^3.0.0"

# Dashboard
streamlit = "^1.35.0"
pandas = "^2.2.0"
plotly = "^5.22.0"

# Testing
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
